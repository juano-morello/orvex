# Local PostgreSQL for Orvex development (ADR-007; LBT-10 spec P-9).
#
#   docker compose -f deployments/docker/compose.yaml up -d --wait
#   export ORVEX_DATABASE_URL='postgres://orvex:orvex@127.0.0.1:55432/orvex?sslmode=disable'
#   crashctl migrate up
#   docker compose -f deployments/docker/compose.yaml down -v
#
# The image must equal pgtest.Image (internal/persistence/postgres/pgtest);
# TestComposeImageMatchesPinnedImage enforces it.
name: orvex

services:
  postgres:
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_USER: orvex
      POSTGRES_PASSWORD: orvex
      POSTGRES_DB: orvex
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "orvex", "-d", "orvex"]
      interval: 2s
      retries: 30

volumes:
  postgres-data:
